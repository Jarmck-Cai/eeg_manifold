name: seeg-manifold

channels:
  - conda-forge

dependencies:
  - python>=3.9,<3.13

  # Core
  - numpy>=1.24,<3.0
  - scipy>=1.10
  - scikit-learn>=1.3

  # Neural data IO
  # mne < 1.6 calls np.cast, removed in NumPy 2.0.
  - mne>=1.6
  - h5py>=3.8

  # Configuration
  - pyyaml>=6.0

  # Visualization
  - matplotlib>=3.7

  # Notebook + testing
  - jupyterlab>=4.0
  - pytest>=7.0

  # Optional analyses (see README "Optional dependencies")
  - pip
  - pip:
      - umap-learn>=0.5.4
      - phate>=1.0
      - ripser>=0.6
      - persim>=0.3
      - plotly>=5.0
