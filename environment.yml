name: seeg-manifold
channels:
  - conda-forge
  - defaults

dependencies:
  # Python version
  - python>=3.9,<3.12
  
  # Core scientific computing
  - numpy>=1.21
  - scipy>=1.7
  - pandas>=1.3
  
  # Neural data processing
  - mne>=1.0
  
  # Machine learning
  - scikit-learn>=1.0
  
  # Visualization
  - matplotlib>=3.5
  - seaborn>=0.11
  - plotly>=5.0
  
  # Jupyter
  - jupyter
  - jupyterlab>=3.0
  - ipywidgets>=8.0
  
  # Utilities
  - pyyaml>=6.0
  - h5py>=3.0
  - tqdm>=4.62
  - joblib>=1.1
  
  # Testing
  - pytest>=7.0
  
  # Pip packages (not available in conda)
  - pip
  - pip:
    - umap-learn>=0.5.0
    - phate>=1.0.0
    - ripser>=0.6.0
    - persim>=0.3.0
    - giotto-tda>=0.6.0
    - pysindy>=1.7.0
    - pydmd>=0.4.0
    - geomstats>=2.5.0
    - neo>=0.11.0
    - pyedflib>=0.1.30
