# SEEG Manifold Analysis - Default Configuration
#
# Status: only the `preprocessing` section is currently loaded by code,
# via PreprocessingConfig.from_yaml(). The remaining sections document the
# defaults that the corresponding functions use internally, but they are
# not read automatically -- pass those values as keyword arguments.

# ============ Data Settings ============
data:
  # Sampling rate (Hz) - will be overridden if specified in data file
  default_sfreq: 1000
  
  # Expected data format
  # 'channels_first': (n_channels, n_timepoints)
  # 'epochs_first': (n_epochs, n_channels, n_timepoints)
  data_format: 'channels_first'

# ============ Preprocessing ============
preprocessing:
  # Filtering
  filter:
    lowcut: 1.0           # High-pass cutoff (Hz)
    highcut: 150.0        # Low-pass cutoff (Hz)
    notch_freq: 50.0      # Notch filter frequency (Hz), set null to disable
    notch_width: 2.0      # Notch filter width (Hz)
    filter_order: 4       # Butterworth filter order
  
  # Artifact removal
  artifact:
    method: 'threshold'   # 'threshold', 'ica', or 'both'
    threshold_std: 5.0    # Threshold for artifact detection (in std)
    
  # Epoching (for continuous data)
  epoching:
    epoch_length: 2.0     # Epoch duration (seconds)
    overlap: 0.5          # Overlap ratio (0-1)

# ============ Feature Extraction ============
features:
  # Spectral analysis
  spectral:
    method: 'welch'       # 'welch' or 'multitaper'
    nperseg: 256          # Segment length for Welch
    noverlap: 128         # Overlap for Welch
    
  # Frequency bands
  bands:
    delta: [1, 4]
    theta: [4, 8]
    alpha: [8, 13]
    beta: [13, 30]
    low_gamma: [30, 70]
    high_gamma: [70, 150]
    
  # Connectivity
  connectivity:
    method: 'correlation'  # 'correlation', 'coherence', 'plv'
    
# ============ Manifold Learning ============
manifold:
  # Dimensionality estimation
  dim_estimation:
    # Accepted by estimate_dimensionality(): pca_variance, pca_elbow, mle
    methods: ['pca_variance', 'pca_elbow', 'mle']
    variance_threshold: 0.95  # For PCA-based estimation
    
  # Reduction methods
  reduction:
    default_n_components: 3
    
    pca:
      whiten: false
      
    umap:
      n_neighbors: 15
      min_dist: 0.1
      metric: 'euclidean'
      
    tsne:
      perplexity: 30
      learning_rate: 200
      n_iter: 1000
      
    isomap:
      n_neighbors: 10
      
    phate:
      knn: 5
      decay: 40
      t: 'auto'

# ============ RSA (Representational Similarity Analysis) ============
rsa:
  # Distance metric for RDM
  distance_metric: 'correlation'  # 'correlation', 'euclidean', 'cosine'
  
  # Comparison methods
  comparison:
    method: 'spearman'     # 'spearman', 'pearson', 'kendall'
    
# ============ Topological Data Analysis ============
topology:
  # Persistent homology
  persistent_homology:
    max_dim: 2            # Maximum homology dimension
    max_edge_length: null # Maximum edge length (null for auto)
    
  # Diagram analysis
  diagram:
    lifetime_threshold: 0.1  # Minimum lifetime to consider

# ============ Symmetry Analysis ============
symmetry:
  # Rotation detection
  rotation:
    method: 'phase_analysis'
    n_bins: 36            # Angular bins for rotation analysis
    
  # Periodicity detection
  periodicity:
    method: 'autocorrelation'
    max_lag: null         # Maximum lag (null for auto)
    
# ============ Visualization ============
visualization:
  # Default figure settings
  figure:
    dpi: 150
    figsize: [10, 8]
    
  # Color schemes
  colors:
    default_cmap: 'viridis'
    diverging_cmap: 'RdBu_r'
    
  # 3D visualization
  plot_3d:
    elevation: 30
    azimuth: 45

# ============ Computation ============
computation:
  # Parallel processing
  n_jobs: -1              # -1 for all cores
  
  # Random state for reproducibility
  random_state: 42
  
  # Memory management
  chunk_size: 10000       # For large data processing
